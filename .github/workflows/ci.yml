name: CI/CD Pipeline - Build & Update GitOps

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Récupération du code source
    - name: Checkout Application Code
      uses: actions/checkout@v4

    # 2. Connexion à Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 3. Extraction de l'identifiant court du commit Git (7 caractères)
    - name: Set Image Tag
      id: vars
      run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # 4. Build et Push de l'image Backend FastAPI
    - name: Build and Push Backend Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend-api
        file: ./backend-api/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-backend:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-backend:${{ steps.vars.outputs.SHA_SHORT }}

    # 5. Build et Push de l'image Frontend Manager Web
    - name: Build and Push Frontend Image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend-web
        file: ./frontend-web/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-web:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-web:${{ steps.vars.outputs.SHA_SHORT }}

    # 6. Récupération du dépôt GitOps pour mise à jour
    - name: Checkout GitOps Repository
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository_owner }}/task-manager-gitops
        token: ${{ secrets.GH_PAT }}
        path: gitops-repo

    # 7. Modification dynamique des manifestes YAML
    - name: Update Image Tags in GitOps Repo
      run: |
        cd gitops-repo
        
        # Remplacement du tag dans le déploiement du Backend
        sed -i "s|image: .*task-manager-backend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-backend:${{ steps.vars.outputs.SHA_SHORT }}|g" apps/backend-api/deployment.yaml
        
        # Remplacement du tag dans le déploiement du Frontend
        sed -i "s|image: .*task-manager-web:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-web:${{ steps.vars.outputs.SHA_SHORT }}|g" apps/manager-web/deployment.yaml

        # Publication des modifications sur task-manager-gitops
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "chore(ci): update image tags to ${{ steps.vars.outputs.SHA_SHORT }}" || exit 0
        git push
